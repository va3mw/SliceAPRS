# SliceAPRS configuration. Everything here can also be set in the GUI.
callsign: ""               # your base call; packets from any of its SSIDs never count
grid: ""                   # 4, 6 or 8 characters; distances are measured from its centre
radio:
  ip: ""                   # blank: find the radio on the LAN
  serial: ""               # with discovery: pick this radio
frequency_mhz: 144.390     # 144.800 in Europe
rxant: ""                  # e.g. XVTA; blank: the radio's choice, or XVTA on a transverter band
daxiq:
  channel: 2               # FlexWSPR normally uses 1
  swap_iq: false
openings:
  distance_km: 300         # any direct path this long is an opening
  sensitivity: medium      # low, medium or high
alerts:
  level: enhanced          # lowest level that alerts: enhanced or open
  voice: false             # speak alerts on this computer
  pushover:                # phone alerts through https://pushover.net/
    enabled: false
    user_key: ""           # your user key, from the Pushover dashboard
    token: ""              # API token of an application you create at pushover.net/apps/build
    priority: 0            # -2 lowest, -1 quiet, 0 normal, 1 high
web:
  listen: 127.0.0.1:8081   # ":8081" for other computers, "off" for none
data_dir: ""               # blank: %ProgramData%\SliceAPRS\data or /var/lib/sliceaprs
debug: false
